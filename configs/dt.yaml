model: dt

data:
  x_train: data/input/X_train.csv
  y_train: data/input/y_train.csv
  x_test: data/input/X_test.csv
  y_test: data/input/y_test.csv

search:
  type: grid
  cv: 5
  scoring: average_precision

params:
  max_depth: [8]
  min_samples_split: [15]
  min_samples_leaf: [70]
  class_weight: ["balanced", null]