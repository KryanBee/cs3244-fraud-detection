model: xgboost

data:
  x_train: data/input/X_train.csv
  y_train: data/input/y_train.csv
  x_test: data/input/X_test.csv
  y_test: data/input/y_test.csv

search:
  type: grid
  cv: 5
  scoring: average_precision

params:
  n_estimators: [200, 400]
  learning_rate: [0.05, 0.1]
  max_depth: [3, 6]
  min_child_weight: [1, 5]
  reg_lambda: [1, 10]
  colsample_bytree: [0.8, 1.0]
  scale_pos_weight: [10, 20]