model: xgboost

data:
  x_train: data/input/X_train.csv
  y_train: data/input/y_train.csv
  x_test: data/input/X_test.csv
  y_test: data/input/y_test.csv

search:
  type: grid
  cv: 5
  scoring: average_precision

params:
  colsample_bytree: [0.8]
  learning_rate: [0.05]
  max_depth: [6]
  min_child_weight: [1]
  n_estimators: [400]
  reg_lambda: [10]
  scale_pos_weight: [16.907483892284816]