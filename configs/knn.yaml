model: knn

data:
  x_train: data/input/X_train.csv
  y_train: data/input/y_train.csv
  x_test: data/input/X_test.csv
  y_test: data/input/y_test.csv

search:
  type: grid
  cv: 3  # Reduced from 5 to 3 to speed up tuning significantly
  scoring: average_precision

params:
  # Exploring higher K values since 31 was the previous best
  n_neighbors: [31, 41, 51, 61, 81, 101]
  weights: ["distance"] # "distance" outperformed "uniform" in your last run
  metric: ["minkowski"]
  p: [1] # Manhattan distance (p=1) was previously preferred