model: knn

data:
  x_train: data/input/X_train.csv
  y_train: data/input/y_train.csv
  x_test: data/input/X_test.csv
  y_test: data/input/y_test.csv

search:
  type: grid
  cv: 3  # Reduced from 5 to 3 to speed up tuning significantly
  scoring: average_precision

params:
  # Starting at your Option B baseline and scaling up for the SMOTE density
  n_neighbors: [51, 101, 151, 201, 251]
  
  # Distance weights are usually better for fraud, but uniform is worth
  # testing as it can be more robust against synthetic noise from SMOTE
  weights: ["uniform", "distance"]
  
  metric: ["minkowski"]
  
  # Manhattan distance (p=1) has consistently outperformed Euclidean (p=2)
  # in all your previous experiments
  p: [1, 2]